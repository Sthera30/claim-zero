  <text x="340" y="210" text-anchor="middle" fill="url(#pinkGrad)" style="stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Playfair Display&quot;, Georgia, serif;font-size:160px;font-weight:700;text-anchor:middle;dominant-baseline:auto">SBB</text>
